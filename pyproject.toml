[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-explore-bench"
version = "0.1.0"
description = "Benchmarks for Lean 4 search engines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "datasketch>=1.6",
    "jsonschema>=4.21",
    "numpy>=1.26",
    "openai>=3.0",
    "pandas>=2.2",
    "plotly>=5.22",
    "scikit-learn>=1.5",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Embedding and 2-D projection of queries; needs a GPU for real logs.
embed = [
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest-cov>=5.0",
    "types-jsonschema>=4.21",
    "umap-learn>=0.5.6",
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
leb-querylog = "lean_explore_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["lean_explore_bench"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["datasketch.*", "plotly.*", "sentence_transformers.*", "sklearn.*", "umap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lean_explore_bench --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95
exclude_also = ['if __name__ == "__main__":']
