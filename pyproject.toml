[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-explore-bench"
version = "0.1.0"
description = "Benchmarks for Lean 4 search engines."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Building the benchmark: writing and judging queries, reading the search log.
build = [
    "cryptography>=42",
    "jsonschema>=4.21",
    "openai>=3.0",
    "pandas>=2.2",
    "tenacity>=8.2",
]
# The BM25 baseline in baselines/.
baselines = [
    "numpy>=1.26",
    "scipy>=1.11",
]
# The figures of the paper.
paper = [
    "matplotlib>=3.8",
]
dev = [
    "lean-explore-bench[build]",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest-cov>=5.0",
    "types-jsonschema>=4.21",
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
leb = "lean_explore_bench.cli:main"
leb-build = "lean_explore_bench.builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["lean_explore_bench"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lean_explore_bench --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95
exclude_also = ['if __name__ == "__main__":']
