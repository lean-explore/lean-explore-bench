name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: No data files committed
        run: python scripts/check_no_data.py
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Types
        run: .venv/bin/mypy
      - name: Function and file size
        run: .venv/bin/python scripts/check_code_size.py
      - name: Test
        run: .venv/bin/pytest -q
